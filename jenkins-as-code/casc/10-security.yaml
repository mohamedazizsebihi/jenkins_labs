# Lab 11 - Sécurité : utilisateurs locaux et matrice de droits (fin du mode « Unsecured »)
jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "dev1"
          name: "dev1"
          password: "${JENKINS_DEV1_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - user:
            name: "dev1"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
