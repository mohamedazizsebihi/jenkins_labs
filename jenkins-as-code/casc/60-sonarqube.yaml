# Lab 14 - Raccordement Jenkins <-> SonarQube
unclassified:
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "sonarqube"
        serverUrl: "http://localhost:9000"
        credentialsId: "sonar-token"
        # Jenkins vérifie la signature HMAC des webhooks reçus sur /sonarqube-webhook/
        webhookSecretId: "sonar-webhook-secret"

tool:
  sonarRunnerInstallation:
    installations:
      - name: "sonar-scanner"
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "8.4.0.16527"
