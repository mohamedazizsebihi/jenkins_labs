# Lab 07 - Credentials déclarés par le code.
# Aucune valeur secrète ici : JCasC résout les ${...} au démarrage
#   - ${VAR}                 -> variable d'environnement (EnvironmentFile=/etc/jenkins/secrets.env)
#   - ${readFileBase64:path} -> contenu d'un fichier encodé en base64
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: demo-api-token
              description: "Lab 07 - token API de démo (secret text)"
              secret: "${DEMO_API_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: httpbin-creds
              description: "Lab 07 - compte httpbin (username/password)"
              username: isoset
              password: "${HTTPBIN_PASSWORD}"
          - file:
              scope: GLOBAL
              id: app-config
              description: "Lab 07 - fichier app.env (secret file)"
              fileName: app.env
              secretBytes: "${readFileBase64:/etc/jenkins/files/app.env}"
