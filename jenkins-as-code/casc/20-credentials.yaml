# Lab 07 - Credentials déclarés par le code.
# Aucune valeur secrète ici : JCasC résout les ${...} au démarrage
#   - ${VAR}                 -> variable d'environnement (EnvironmentFile=/etc/jenkins/secrets.env)
#   - ${readFileBase64:path} -> contenu d'un fichier encodé en base64
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: demo-api-token
              description: "Lab 07 - token API de démo (secret text)"
              secret: "${DEMO_API_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: httpbin-creds
              description: "Lab 07 - compte httpbin (username/password)"
              username: isoset
              password: "${HTTPBIN_PASSWORD}"
          - file:
              scope: GLOBAL
              id: app-config
              description: "Lab 07 - fichier app.env (secret file)"
              fileName: app.env
              secretBytes: "${readFileBase64:/etc/jenkins/files/app.env}"
          # Lab 09 - registre Docker (registre local registry:2 ; pour Docker Hub : DOCKERHUB_USER/TOKEN)
          - usernamePassword:
              scope: GLOBAL
              id: registry-creds
              description: "Lab 09 - registre Docker (login --password-stdin)"
              username: "${REGISTRY_USER}"
              password: "${REGISTRY_TOKEN}"
          # Lab 10 - clé privée de l'agent SSH : scope SYSTEM (réservée à Jenkins, invisible des jobs)
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: agent-ssh-key
              username: jenkins
              description: "Lab 10 - clé SSH de l'agent agent-ssh-1"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/etc/jenkins/files/jenkins_agent}"
          # Lab 11 - clé SSH de l'instance EC2 : scope GLOBAL (utilisée par les pipelines via sshagent)
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: ec2-ssh-key
              username: ubuntu
              description: "Lab 11 - clé SSH EC2 (utilisateur ubuntu)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/etc/jenkins/files/ec2.pem}"
          # Lab 14 - jeton d'analyse SonarQube (utilisateur technique jenkins-ci, droits limités au projet)
          - string:
              scope: GLOBAL
              id: sonar-token
              description: "Lab 14 - jeton SonarQube (jenkins-ci)"
              secret: "${SONAR_TOKEN}"
          # Lab 14 - secret partagé du webhook SonarQube -> Jenkins (signature HMAC vérifiée par Jenkins)
          - string:
              scope: GLOBAL
              id: sonar-webhook-secret
              description: "Lab 14 - secret du webhook SonarQube"
              secret: "${SONAR_WEBHOOK_SECRET}"
